<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <title>恐龙快跑</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Huazie">
    <meta name="keywords" content="恐龙快跑,跑酷,像素恐龙">
    <meta name="description" content="像素恐龙跑酷小游戏">
    <link rel="shortcut icon" href="../assets/images/flea-game.ico">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- 浮动圆形按钮：左上返回，右上音效/主题（参考 2048 布局） -->
    <button id="back-button" class="control-button" title="返回">
        <i class="fas fa-arrow-left"></i>
    </button>
    <div class="floating-buttons">
        <button id="sound-button" class="control-button" title="音效开关">
            <i class="fas fa-volume-high"></i>
        </button>
        <button id="theme-button" class="control-button" title="切换主题">
            <i class="fas fa-sun"></i>
        </button>
    </div>
    <div class="game-container">
        <div class="game-header">
            <h1>恐龙快跑</h1>
            <div class="scores-container">
                <div class="score-container">
                    <div class="score-label">分数</div>
                    <span id="score">00000</span>
                </div>
                <div class="best-container">
                    <div class="score-label">最高分</div>
                    <span id="best-score">00000</span>
                </div>
            </div>
        </div>
        <div class="game-board-container">
            <canvas id="game-board"></canvas>
        </div>
        <div class="game-controls">
            <div class="control-panel">
                <div class="difficulty-container">
                    <label for="difficulty-select">难度：</label>
                    <select id="difficulty-select" class="difficulty-select">
                        <option value="easy">简单</option>
                        <option value="normal">普通</option>
                        <option value="hard">困难</option>
                    </select>
                </div>
                <div class="control-info">
                    <p class="help-keyboard">空格 / W / ↑ 跳跃　　S / ↓ 蹲伏　　P 暂停</p>
                    <p class="help-touch">点左侧「跳」　　按右侧「蹲」低身</p>
                </div>
            </div>
            <div class="control-buttons">
                <button id="start-btn">开始</button>
                <button id="restart-btn">重玩</button>
            </div>
        </div>
        <!-- 触屏分区触控区：容器直接子元素，flex:1 撑满底部剩余空间，通栏贴边 -->
        <div class="touch-controls">
            <button id="touch-jump" class="touch-zone touch-jump">跳</button>
            <button id="touch-duck" class="touch-zone touch-duck">蹲</button>
        </div>
    </div>
    <script src="../assets/js/common.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/game.js"></script>

    <script src="../assets/js/comments.js"></script>
    <script>FleaComments.init('dino');</script>
    <script src="../assets/js/share.js"></script>
    <script>FleaShare.init();</script>
</body>
</html>
