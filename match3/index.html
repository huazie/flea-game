<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="author" content="Huazie">
    <meta name="keywords" content="消消乐,Match3,益智游戏">
    <meta name="description" content="消消乐 - 现代化三消游戏">
    <link rel="shortcut icon" href="../assets/images/flea-game.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- 返回按钮 -->
    <button id="back-button" class="control-button">
        <i class="fas fa-arrow-left"></i>
    </button>

    <!-- 主题切换 -->
    <button id="theme-button" class="control-button">
        <i class="fas fa-sun"></i>
    </button>

    <!-- 游戏主体 -->
    <div class="game-wrapper">

        <!-- 顶部状态栏 -->
        <div class="top-bar">
            <div class="game-title">消消乐</div>
            <div class="stat-group">
                <div class="stat-box">
                    <div class="stat-label">分数</div>
                    <div class="stat-value" id="score">0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">最高</div>
                    <div class="stat-value" id="best-score">0</div>
                </div>
            </div>
        </div>

        <!-- 关卡信息栏 -->
        <div class="level-bar">
            <div class="level-info">
                <span class="level-badge" id="level-num">1</span>
                <span class="level-desc">关卡目标: <strong id="target-score">1,000</strong></span>
            </div>
            <div class="moves-info">
                <span class="moves-icon">👣</span>
                <div>
                    <div class="moves-count" id="moves-count">25</div>
                    <div class="moves-label">剩余步数</div>
                </div>
            </div>
        </div>

        <!-- 道具栏 -->
        <div class="power-bar">
            <button class="power-btn" id="hint-btn" title="显示提示">
                <span>💡</span> 提示 <span class="count">3</span>
            </button>
            <button class="power-btn" id="shuffle-btn" title="重新洗牌">
                <span>🔀</span> 洗牌 <span class="count">1</span>
            </button>
            <button class="power-btn" id="new-game-btn">
                <span class="emoji">🎮</span> 新游戏
            </button>
        </div>

        <!-- 游戏棋盘 -->
        <div class="board-wrapper">
            <div class="game-board">
                <!-- 8×8 grid-cell 由 JS 动态生成 -->
            </div>

            <!-- 遮罩结束画面 -->
            <div class="overlay" id="overlay">
                <div class="overlay-title">🎉 恭喜过关！</div>
                <div class="overlay-score">本局得分: 0</div>
                <div class="overlay-buttons">
                    <button class="overlay-btn secondary" id="retry-btn">🔄 重来</button>
                    <button class="overlay-btn" id="next-btn">下一关 ➜</button>
                </div>
            </div>

            <!-- 通关庆祝页面 -->
            <div class="overlay" id="victory-overlay">
                <div class="overlay-title">🏆 恭喜通关全部5关！</div>
                <div class="overlay-score" id="victory-score">最终得分: 0</div>
                <div class="overlay-buttons">
                    <button class="overlay-btn" id="restart-btn">🎮 重新开始</button>
                </div>
            </div>
        </div>

    </div>

    <script src="../assets/js/common.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/game.js"></script>

    <script src="../assets/js/comments.js"></script>
    <script>FleaComments.init('match3');</script>
</body>
</html>
