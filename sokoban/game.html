<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <title>推箱子</title>    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Huazie">
    <meta name="keywords" content="推箱子,Sokoban">
    <meta name="description" content="经典推箱子小游戏">
    <link rel="shortcut icon" href="../assets/images/flea-game.ico">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" media="print" onload="this.media='all'">
</head>
<body>
    <button id="back-button" class="control-button">
        <i class="fas fa-arrow-left"></i>
    </button>
    <button id="theme-button" class="control-button">
        <i class="fas fa-sun"></i>
    </button>
    
    <div class="game-container">
        <div class="header">
            <h1>推箱子</h1>
            <div class="stats">
                <div class="stat">
                    <div class="stat-label">关卡</div>
                    <div class="stat-value" id="level-num">1</div>
                </div>
                <div class="stat">
                    <div class="stat-label">步数</div>
                    <div class="stat-value" id="moves-count">0</div>
                </div>
                <div class="stat">
                    <div class="stat-label">最佳</div>
                    <div class="stat-value" id="best-moves">-</div>
                </div>
            </div>
        </div>
        <div class="level-title" id="level-name"></div>

        <div class="controls">
            <button id="prev-level-btn" class="button">上一关</button>
            <button id="undo-btn" class="button">撤销</button>
            <button id="reset-btn" class="button">重置</button>
            <button id="next-level-btn" class="button">下一关</button>
            <button id="upload-btn" class="button">上传关卡</button>
            <input type="file" id="level-file" accept=".json,.txt,application/json,text/plain" style="display:none">
        </div>

        <div class="board-wrap">
            <div id="board" class="game-board"></div>
            <div id="game-message" class="game-message">
                <p></p>
                <div class="game-message-buttons">
                    <button id="next-btn" class="button">下一关</button>
                    <button id="retry-btn" class="button">再试一次</button>
                </div>
            </div>
        </div>

        <div class="game-intro">
            <p class="pc-instruction">使用 <strong>方向键</strong> 或 <strong>WASD</strong> 移动，把所有箱子推到目标点。<strong>Z</strong> 撤销。</p>
            <p class="mobile-instruction">通过 <strong>滑动</strong> 移动，把所有箱子推到目标点。</p>
        </div>
    </div>

    <script src="../assets/js/common.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/levels.js"></script>
    <script src="js/userlevels.js"></script>
    <script src="js/game.js"></script>

    <script src="../assets/js/comments.js"></script>
    <script>FleaComments.init('sokoban');</script>

    <div id="level-toast" class="level-toast"></div>
</body>
</html>
